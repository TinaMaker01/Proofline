<!doctype html>
<html lang="fr" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proofline — QA & Sécurité continue pour vos apps créées par IA</title>
    <meta
      name="description"
      content="Tests automatisés, vérification de sécurité et correctifs en langage clair pour les applications créées avec Lovable, Bolt, Cursor, Replit et v0."
    />
    <meta property="og:title" content="Proofline — QA & Sécurité continue pour vos apps créées par IA" />
    <meta
      property="og:description"
      content="Vérifiez en continu que chaque parcours fonctionne et qu'aucune donnée sensible n'est exposée sur vos apps Lovable, Bolt et Cursor."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('proofline-theme');
          if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
          var savedLocale = localStorage.getItem('proofline-locale');
          document.documentElement.lang = savedLocale === 'en' ? 'en' : 'fr';
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.lang = 'fr';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#F8FAFC] dark:bg-[#090D16] text-[#0F172A] dark:text-[#F8FAFC] antialiased selection:bg-[#2563EB]/20 selection:text-[#1E40AF] dark:selection:bg-[#3B82F6]/30 dark:selection:text-[#BFDBFE] transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
