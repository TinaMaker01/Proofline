<!doctype html>
<html lang="fr" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proofline — Ton app générée par IA est-elle vraiment sûre ?</title>
    <meta
      name="description"
      content="Reçois en 5 minutes un audit de sécurité passif gratuit pour ton app Lovable, Bolt, Cursor, Replit ou v0 : clés exposées, base de données ouverte, parcours cassés. Sans jargon."
    />
    <meta property="og:title" content="Proofline — Audit de sécurité pour apps générées par IA" />
    <meta
      property="og:description"
      content="Modifie ton app avec l’IA sans peur : détection des clés exposées, bases ouvertes et régressions cachées, avec correctifs en langage clair."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Proofline",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Web",
        "description": "Audit de sécurité passif et détection de régressions pour applications générées par IA (Lovable, Bolt, Cursor, Replit, v0)."
      }
    </script>
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('proofline-theme');
          if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
          var savedLocale = localStorage.getItem('proofline-locale');
          document.documentElement.lang = savedLocale === 'en' ? 'en' : 'fr';
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.lang = 'fr';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#F8FAFC] dark:bg-[#090D16] text-[#0F172A] dark:text-[#F8FAFC] antialiased selection:bg-[#2563EB]/20 selection:text-[#1E40AF] dark:selection:bg-[#3B82F6]/30 dark:selection:text-[#BFDBFE] transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
